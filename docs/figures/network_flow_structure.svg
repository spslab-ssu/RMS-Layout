<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#059669"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #0f172a; }
      .panel-title { font: 700 23px -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #475569; }
      .label { font: 600 16px -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #0f172a; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #475569; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif; fill: #64748b; }
      .formula { font: 600 16px "SFMono-Regular", Consolas, monospace; fill: #065f46; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 12; filter: url(#shadow); }
      .active-node { fill: #dbeafe; stroke: #2563eb; stroke-width: 3; rx: 12; filter: url(#shadow); }
      .flow-node { fill: #ecfdf5; stroke: #059669; stroke-width: 2.5; rx: 12; filter: url(#shadow); }
      .inactive-node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 7 6; rx: 12; }
      .active-arc { fill: none; stroke: #2563eb; stroke-width: 5; marker-end: url(#arrowBlue); }
      .alternative-arc { fill: none; stroke: #cbd5e1; stroke-width: 1.7; marker-end: url(#arrowGray); }
      .material-arc { fill: none; stroke: #059669; stroke-width: 4; marker-end: url(#arrowGreen); }
      .capacity-link { fill: none; stroke: #0f766e; stroke-width: 3; stroke-dasharray: 9 7; marker-end: url(#arrowGreen); }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="url(#background)"/>
  <text x="70" y="62" class="title">RMS Network Reformulation - 두 개의 연결된 흐름</text>
  <text x="70" y="91" class="subtitle">위: 기계의 시간별 lifecycle path  |  아래: 제품의 operation-location material flow</text>

  <!-- Machine lifecycle panel -->
  <rect x="55" y="120" width="1490" height="455" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="55" y="120" width="1490" height="62" rx="24" fill="#e0e7ff"/>
  <path d="M55 158 H1545" stroke="#c7d2fe" stroke-width="1"/>
  <text x="85" y="159" class="panel-title">1. Machine lifecycle network</text>
  <text x="475" y="157" class="subtitle">한 위치 p에서 구매, 유지, operation 변경, configuration 재구성을 하나의 path로 선택</text>

  <text x="347" y="207" class="label">t = 1</text>
  <text x="637" y="207" class="label">t = 2</text>
  <text x="927" y="207" class="label">t = 3</text>
  <text x="1217" y="207" class="label">t = 4</text>

  <!-- Alternative network arcs -->
  <path d="M210 348 C255 270 285 245 330 245" class="alternative-arc"/>
  <path d="M210 348 C255 350 285 350 330 350" class="alternative-arc"/>
  <path d="M210 348 C255 430 285 455 330 455" class="alternative-arc"/>
  <path d="M470 245 C525 245 555 245 620 245" class="alternative-arc"/>
  <path d="M470 245 C525 285 555 315 620 350" class="alternative-arc"/>
  <path d="M470 350 C525 300 555 270 620 245" class="alternative-arc"/>
  <path d="M470 455 C525 420 555 385 620 350" class="alternative-arc"/>
  <path d="M760 245 C815 245 845 245 910 245" class="alternative-arc"/>
  <path d="M760 350 C815 300 845 270 910 245" class="alternative-arc"/>
  <path d="M760 350 C815 350 845 350 910 350" class="alternative-arc"/>
  <path d="M760 455 C815 420 845 385 910 350" class="alternative-arc"/>
  <path d="M1050 245 C1105 245 1135 245 1200 245" class="alternative-arc"/>
  <path d="M1050 350 C1105 300 1135 270 1200 245" class="alternative-arc"/>
  <path d="M1050 350 C1105 350 1135 350 1200 350" class="alternative-arc"/>
  <path d="M1050 455 C1105 420 1135 385 1200 350" class="alternative-arc"/>
  <path d="M1340 245 C1390 270 1405 310 1430 348" class="alternative-arc"/>
  <path d="M1340 350 C1380 350 1400 350 1430 350" class="alternative-arc"/>
  <path d="M1340 455 C1390 430 1405 390 1430 352" class="alternative-arc"/>

  <!-- Source and sink -->
  <circle cx="175" cy="350" r="36" fill="#1e293b" filter="url(#shadow)"/>
  <text x="175" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">SOURCE</text>
  <text x="175" y="366" text-anchor="middle" font-size="11" fill="#cbd5e1">위치 p</text>
  <circle cx="1465" cy="350" r="36" fill="#1e293b" filter="url(#shadow)"/>
  <text x="1465" y="355" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">SINK</text>

  <!-- State nodes -->
  <rect x="330" y="218" width="140" height="55" class="node"/>
  <text x="400" y="241" text-anchor="middle" class="small">mc32</text>
  <text x="400" y="260" text-anchor="middle" class="tiny">operation 11</text>
  <rect x="330" y="317" width="140" height="66" class="active-node"/>
  <text x="400" y="342" text-anchor="middle" class="label">mc31</text>
  <text x="400" y="364" text-anchor="middle" class="small">operation 2</text>
  <rect x="330" y="428" width="140" height="55" class="inactive-node"/>
  <text x="400" y="461" text-anchor="middle" class="small">다른 feasible state</text>

  <rect x="620" y="218" width="140" height="55" class="node"/>
  <text x="690" y="241" text-anchor="middle" class="small">mc32</text>
  <text x="690" y="260" text-anchor="middle" class="tiny">operation 11</text>
  <rect x="620" y="317" width="140" height="66" class="active-node"/>
  <text x="690" y="342" text-anchor="middle" class="label">mc31</text>
  <text x="690" y="364" text-anchor="middle" class="small">operation 2</text>
  <rect x="620" y="428" width="140" height="55" class="inactive-node"/>
  <text x="690" y="461" text-anchor="middle" class="small">다른 feasible state</text>

  <rect x="910" y="218" width="140" height="55" class="node"/>
  <text x="980" y="241" text-anchor="middle" class="small">mc31</text>
  <text x="980" y="260" text-anchor="middle" class="tiny">operation 2</text>
  <rect x="910" y="317" width="140" height="66" class="active-node"/>
  <text x="980" y="342" text-anchor="middle" class="label">mc32</text>
  <text x="980" y="364" text-anchor="middle" class="small">operation 11</text>
  <rect x="910" y="428" width="140" height="55" class="inactive-node"/>
  <text x="980" y="461" text-anchor="middle" class="small">다른 feasible state</text>

  <rect x="1200" y="218" width="140" height="55" class="node"/>
  <text x="1270" y="241" text-anchor="middle" class="small">mc31</text>
  <text x="1270" y="260" text-anchor="middle" class="tiny">operation 2</text>
  <rect x="1200" y="317" width="140" height="66" class="active-node"/>
  <text x="1270" y="342" text-anchor="middle" class="label">mc32</text>
  <text x="1270" y="364" text-anchor="middle" class="small">operation 11</text>
  <rect x="1200" y="428" width="140" height="55" class="inactive-node"/>
  <text x="1270" y="461" text-anchor="middle" class="small">다른 feasible state</text>

  <!-- Highlighted lifecycle path -->
  <path d="M211 350 L323 350" class="active-arc"/>
  <path d="M470 350 L613 350" class="active-arc"/>
  <path d="M760 350 L903 350" class="active-arc"/>
  <path d="M1050 350 L1193 350" class="active-arc"/>
  <path d="M1340 350 L1422 350" class="active-arc"/>
  <text x="264" y="331" class="small" fill="#1d4ed8">구매비 C(mc31)</text>
  <text x="522" y="331" class="small" fill="#1d4ed8">유지비 0</text>
  <text x="792" y="331" class="small" fill="#1d4ed8">재구성비 r(mc31,mc32)</text>
  <text x="1099" y="331" class="small" fill="#1d4ed8">유지비 0</text>
  <text x="400" y="405" text-anchor="middle" class="tiny">w[p,mc31,2,1] = 1</text>
  <text x="980" y="405" text-anchor="middle" class="tiny">w[p,mc32,11,3] = 1</text>
  <text x="825" y="401" text-anchor="middle" class="tiny">선택 transition z = 1</text>
  <rect x="555" y="500" width="495" height="48" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="802" y="530" text-anchor="middle" class="label" fill="#1d4ed8">incoming z = node w = outgoing z  →  하나의 연속된 lifecycle path</text>

  <!-- Capacity coupling -->
  <path d="M980 383 C980 505 900 565 825 672" class="capacity-link"/>
  <rect x="790" y="578" width="440" height="74" rx="16" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1010" y="607" text-anchor="middle" class="label" fill="#115e59">Machine layer가 처리 가능한 flow를 제한</text>
  <text x="1010" y="635" text-anchor="middle" class="formula">v[p,l,t] ≤ Σj B[j,l] · w[p,j,l,t]</text>

  <!-- Material flow panel -->
  <rect x="55" y="675" width="1490" height="315" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="55" y="675" width="1490" height="62" rx="24" fill="#d1fae5"/>
  <path d="M55 713 H1545" stroke="#a7f3d0" stroke-width="1"/>
  <text x="85" y="714" class="panel-title">2. Material-flow network - 한 기간 t</text>
  <text x="512" y="712" class="subtitle">입구 → operation 순서 → 출구의 제품 흐름, 위치 선택에 따라 물류비 발생</text>

  <circle cx="160" cy="850" r="43" fill="#064e3b" filter="url(#shadow)"/>
  <text x="160" y="846" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ENTRY</text>
  <text x="160" y="867" text-anchor="middle" font-size="12" fill="#a7f3d0">START</text>

  <rect x="340" y="778" width="175" height="76" class="flow-node"/>
  <text x="427" y="806" text-anchor="middle" class="label">위치 p1</text>
  <text x="427" y="832" text-anchor="middle" class="small">operation 1</text>
  <rect x="340" y="886" width="175" height="76" class="flow-node"/>
  <text x="427" y="914" text-anchor="middle" class="label">위치 p2</text>
  <text x="427" y="940" text-anchor="middle" class="small">operation 1</text>

  <rect x="725" y="778" width="175" height="76" class="flow-node"/>
  <text x="812" y="806" text-anchor="middle" class="label">위치 p3</text>
  <text x="812" y="832" text-anchor="middle" class="small">operation 2</text>
  <rect x="725" y="886" width="175" height="76" class="flow-node"/>
  <text x="812" y="914" text-anchor="middle" class="label">위치 p4</text>
  <text x="812" y="940" text-anchor="middle" class="small">operation 2</text>

  <circle cx="1430" cy="850" r="43" fill="#064e3b" filter="url(#shadow)"/>
  <text x="1430" y="846" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">EXIT</text>
  <text x="1430" y="867" text-anchor="middle" font-size="12" fill="#a7f3d0">END</text>

  <path d="M202 838 C250 815 285 812 332 815" class="material-arc"/>
  <path d="M202 862 C250 900 285 920 332 923" class="material-arc"/>
  <path d="M515 815 C595 815 640 815 717 815" class="material-arc"/>
  <path d="M515 826 C600 860 640 905 717 920" class="material-arc"/>
  <path d="M515 923 C600 890 640 840 717 824" class="material-arc"/>
  <path d="M515 934 C595 934 640 934 717 934" class="material-arc"/>
  <path d="M900 815 C1090 815 1230 820 1380 840" class="material-arc"/>
  <path d="M900 934 C1090 930 1230 895 1380 861" class="material-arc"/>

  <text x="252" y="801" class="small" fill="#047857">입구 flow</text>
  <text x="585" y="798" class="small" fill="#047857">f[p1,op1,p3,op2,t]</text>
  <text x="1070" y="799" class="small" fill="#047857">출구 flow</text>
  <text x="1045" y="955" class="small" fill="#047857">물류비 = MHC · D[p,q] · f</text>

  <!-- Legend -->
  <rect x="1030" y="872" width="330" height="86" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="1050" y="890" width="36" height="22" class="active-node"/>
  <text x="1098" y="906" class="tiny">선택된 machine state w (binary)</text>
  <line x1="1050" y1="933" x2="1086" y2="933" stroke="#2563eb" stroke-width="5"/>
  <text x="1098" y="938" class="tiny">선택된 transition z (continuous arc)</text>
</svg>
